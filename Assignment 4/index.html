<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Georgia, serif;
        background: var(--light);
        color: var(--dark);
        line-height: 1.6;
        padding: var(--gap);
      }
      h1 {
        font-size: 2.2rem;
        letter-spacing: 1px;
      }
      #hero {
        background: var(--brand);
        color: white;
        text-align: center;
        padding: 32px var(--gap);
        border-radius: 10px;
      }
      .card {
        background: white;
        padding: var(--gap);
        margin-top: var(--gap);
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <table border="1">
      <tr>
        <th>Event</th>
        <th>Date</th>
        <th>Venue</th>
      </tr>
      <tr>
        <td>HTML workshop</td>
        <td>Hackathon</td>
        <td>Seminar hall</td>
      </tr>
      <tfoot>
        <tr>
          <td colspan="3">total events: 2</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
